<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#111827"/>
  <!-- Credit card icon -->
  <rect x="4" y="9" width="24" height="16" rx="3" fill="url(#g1)"/>
  <!-- Chip -->
  <rect x="7" y="13" width="6" height="4" rx="1" fill="#fbbf24"/>
  <!-- Stripe -->
  <rect x="4" y="16" width="24" height="3" fill="rgba(0,0,0,0.2)"/>
  <!-- CX letters -->
  <text x="16" y="22" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="6" font-weight="900" fill="white" letter-spacing="0.5">CX</text>
  <defs>
    <linearGradient id="g1" x1="4" y1="9" x2="28" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
</svg>
