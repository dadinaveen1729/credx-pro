<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Background card shape -->
  <rect x="0" y="8" width="48" height="30" rx="5" fill="url(#cardGrad)" />
  <!-- Card chip -->
  <rect x="7" y="15" width="10" height="8" rx="2" fill="url(#chipGrad)" />
  <line x1="7" y1="19" x2="17" y2="19" stroke="#f97316" stroke-width="0.8" opacity="0.6"/>
  <line x1="9" y1="15" x2="9" y2="23" stroke="#f97316" stroke-width="0.8" opacity="0.6"/>
  <line x1="12" y1="15" x2="12" y2="23" stroke="#f97316" stroke-width="0.8" opacity="0.6"/>
  <line x1="15" y1="15" x2="15" y2="23" stroke="#f97316" stroke-width="0.8" opacity="0.6"/>
  <!-- Magnetic stripe dots -->
  <circle cx="28" cy="17" r="1.5" fill="#fb923c" opacity="0.8"/>
  <circle cx="33" cy="17" r="1.5" fill="#f97316" opacity="0.9"/>
  <circle cx="38" cy="17" r="1.5" fill="#ea580c"/>
  <!-- Card number dots -->
  <circle cx="8" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="11" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="14" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="17" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="22" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="25" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="28" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="31" cy="30" r="1" fill="white" opacity="0.6"/>
  <!-- Glow ring behind card -->
  <ellipse cx="24" cy="23" rx="22" ry="14" fill="none" stroke="url(#glowGrad)" stroke-width="1" opacity="0.4"/>
  <!-- Text: CREDX -->
  <text x="58" y="35" font-family="'Arial Black', 'Arial Bold', Arial, sans-serif" font-size="26" font-weight="900" letter-spacing="1" fill="white">CREDX</text>
  <!-- Text: USA with orange gradient -->
  <text x="158" y="35" font-family="'Arial Black', 'Arial Bold', Arial, sans-serif" font-size="26" font-weight="900" letter-spacing="1" fill="url(#textGrad)">USA</text>
  <!-- Tagline -->
  <text x="58" y="50" font-family="Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.5" fill="#f97316" opacity="0.85">CREDIT · BILLS · AI</text>
  <!-- Gradient defs -->
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="8" x2="48" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="7" y1="15" x2="17" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="48" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="158" y1="10" x2="220" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
</svg>
